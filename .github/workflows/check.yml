name: Validate public site

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify public architecture
        run: npm run verify:architecture

      - name: Check site
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Verify static boundary
        run: npm run verify:static

      - name: Check internal links
        run: npm run verify:links
