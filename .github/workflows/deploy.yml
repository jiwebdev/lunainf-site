name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Verify public architecture
        run: npm run verify:architecture

      - name: Check site
        run: npm run check

      - name: Compute Sleeve audio cache key
        id: sleeve-audio-key
        run: echo "hash=$(python scripts/generate_sleeve_audio.py --hash-only)" >> "$GITHUB_OUTPUT"

      - name: Restore Sleeve audio cache
        id: sleeve-audio-cache
        uses: actions/cache@v4
        with:
          path: public/assets/research/sleeve-audio
          key: sleeve-audio-v1-${{ steps.sleeve-audio-key.outputs.hash }}

      - name: Generate Sleeve response audio
        if: steps.sleeve-audio-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install edge-tts
          python scripts/generate_sleeve_audio.py

      - name: Build
        run: npm run build

      - name: Verify static boundary
        run: npm run verify:static

      - name: Check internal links
        run: npm run verify:links

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
