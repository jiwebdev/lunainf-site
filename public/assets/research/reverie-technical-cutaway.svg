<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Reverie Technical Cutaway</title>
  <desc id="desc">A high-level cutaway of a bounded Reverie workspace admission path that can admit zero or one associative memory without a language-model call for the admission decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071d3e"/>
      <stop offset="1" stop-color="#051122"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1665f2"/><stop offset="1" stop-color="#0fbfd5"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1665f2"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="90" y="90" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5" fill="#1665f2">TECHNICAL CUTAWAY · REVERIE</text>
  <text x="90" y="150" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="620" letter-spacing="-1.5" fill="#051122">A memory can become a new cue.</text>
  <text x="90" y="194" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" fill="#6c7a8a">The interface and invariant are public. The decision function stays protected.</text>

  <rect x="90" y="250" width="1420" height="500" rx="30" fill="url(#dark)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="150" y="310" font-size="17" font-weight="750" letter-spacing="3" fill="#6fb1ff">EXISTING ACTIVATION PULSE</text>
    <text x="150" y="343" font-size="23" fill="#dce9f7">Internally triggered associative candidates</text>

    <g>
      <circle cx="230" cy="450" r="34" fill="#0b2347" stroke="#1665f2" stroke-width="3"/>
      <circle cx="315" cy="410" r="27" fill="#0b2347" stroke="#0fbfd5" stroke-width="3"/>
      <circle cx="335" cy="505" r="25" fill="#0b2347" stroke="#4f8cff" stroke-width="3"/>
      <circle cx="190" cy="540" r="22" fill="#0b2347" stroke="#365c8c" stroke-width="2"/>
      <line x1="258" y1="438" x2="288" y2="423" stroke="url(#glow)" stroke-width="3"/>
      <line x1="258" y1="468" x2="312" y2="494" stroke="url(#glow)" stroke-width="3"/>
      <line x1="214" y1="481" x2="197" y2="519" stroke="#365c8c" stroke-width="2"/>
    </g>

    <line x1="400" y1="465" x2="545" y2="465" stroke="#1665f2" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="565" y="355" width="390" height="220" rx="28" fill="#ffffff" stroke="#0fbfd5" stroke-width="3"/>
    <text x="760" y="405" text-anchor="middle" font-size="17" font-weight="750" letter-spacing="3" fill="#1665f2">REVERIE ADMISSION GATE</text>
    <text x="760" y="449" text-anchor="middle" font-size="30" font-weight="650" fill="#051122">Deterministic boundary</text>
    <text x="760" y="486" text-anchor="middle" font-size="20" fill="#6c7a8a">protected decision logic</text>
    <path d="M715 523h90" stroke="#dbe3ec" stroke-width="2"/>
    <circle cx="760" cy="523" r="8" fill="#0fbfd5"/>

    <line x1="955" y1="465" x2="1095" y2="465" stroke="#1665f2" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="1115" y="365" width="330" height="200" rx="26" fill="#0b2347" stroke="#2e6bb6" stroke-width="2"/>
    <text x="1280" y="410" text-anchor="middle" font-size="17" font-weight="750" letter-spacing="3" fill="#6fb1ff">FOREGROUND WORKSPACE</text>
    <text x="1280" y="464" text-anchor="middle" font-size="50" font-weight="700" fill="#ffffff">0 or 1</text>
    <text x="1280" y="505" text-anchor="middle" font-size="20" fill="#aebfd2">optional associative memory</text>
    <text x="1280" y="538" text-anchor="middle" font-size="18" fill="#82a4ca">then Sleeve reasoning proceeds</text>

    <g>
      <rect x="150" y="625" width="360" height="74" rx="16" fill="#091b35" stroke="#22579d"/>
      <circle cx="184" cy="662" r="7" fill="#0fbfd5"/><text x="210" y="669" font-size="19" fill="#dce9f7">NO MODEL CALL TO ADMIT</text>
      <rect x="550" y="625" width="360" height="74" rx="16" fill="#091b35" stroke="#22579d"/>
      <circle cx="584" cy="662" r="7" fill="#1665f2"/><text x="610" y="669" font-size="19" fill="#dce9f7">MEMORY AUTHORITY PRESERVED</text>
      <rect x="950" y="625" width="360" height="74" rx="16" fill="#091b35" stroke="#22579d"/>
      <circle cx="984" cy="662" r="7" fill="#ffffff"/><text x="1010" y="669" font-size="19" fill="#dce9f7">BOUNDED FOREGROUND EFFECT</text>
    </g>
  </g>

  <text x="90" y="812" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#6c7a8a">Published: interface · invariant · observable behavior. Protected: scoring · thresholds · ranking · private schemas · orchestration.</text>
  <text x="90" y="854" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#1665f2">LUNA · OPEN RESEARCH / PROTECTED IMPLEMENTATION</text>
</svg>
